[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-technology-recon-gatherer"
version = "0.1.0"
description = "Local AI recon tools: Reddit scraper and multi-source RSS/feed app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.117.1",
    "langchain-openai>=1.2.2",
    "playwright>=1.52.0",
    "psycopg[binary]>=3.2.13",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[project.scripts]
feed-app = "feed_app.cli:main"
scrape-reddit = "reddit_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_app", "src/reddit_scraper"]

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
